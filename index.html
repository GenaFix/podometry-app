<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Holyiot Podometry Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/smoothie@1.36.1/smoothie.min.js"></script>
  <style>
    body { margin: 0; background-color: #121212; color: white; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* Топология стоп */
    #topology-container { display: flex; justify-content: space-around; padding: 20px 10px; background: #1a1a1a; flex-shrink: 0; border-bottom: 2px solid #333; }
    .foot-map { display: flex; flex-direction: column; align-items: center; width: 45%; background: #222; border-radius: 40px; padding: 20px 10px; box-sizing: border-box; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
    .foot-label { font-size: 14px; color: #aaa; margin-bottom: 25px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    
    .toes-row { display: flex; justify-content: space-between; width: 90%; margin-bottom: 40px; }
    .heel-row { display: flex; justify-content: center; width: 100%; }
    
    /* Интерактивные точки (Датчики) */
    .sensor-node { width: 50px; height: 50px; border-radius: 25px; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; color: #000; box-shadow: 0 4px 8px rgba(0,0,0,0.4); transition: transform 0.1s; }
    .sensor-node:active { transform: scale(0.9); }
    .sensor-node.connected { opacity: 0.3; box-shadow: none; color: #fff; }
    
    .node-red { background: #ff3b30; color: white; }
    .node-yellow { background: #ffcc00; }
    .node-blue { background: #007aff; color: white; }

    /* Графики */
    .charts-wrapper { display: flex; flex-direction: column; flex: 1; }
    .chart-box { flex: 1; background: #1a1a1a; padding: 5px; display: flex; flex-direction: column; border-bottom: 1px solid #333; }
    .chart-header { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 2px; text-transform: uppercase; }
    canvas { display: block; width: 100%; height: 100%; }
    
    .val-red { color: #ff3b30; font-weight: bold; }
    .val-yellow { color: #ffcc00; font-weight: bold; }
    .val-blue { color: #007aff; font-weight: bold; }
  </style>
</head>
<body>

  <!-- БЛОК ТОПОЛОГИИ (Карта датчиков) -->
  <div id="topology-container">
    
    <!-- Левая Стопа -->
    <div class="foot-map">
      <div class="foot-label">Левая (Left)</div>
      <div class="toes-row">
        <!-- У левой ноги мизинец (Синий) слева, большой палец (Желтый) справа -->
        <button id="btn-l-blue" class="sensor-node node-blue">L_Blu</button>
        <button id="btn-l-yellow" class="sensor-node node-yellow">L_Yel</button>
      </div>
      <div class="heel-row">
        <button id="btn-l-red" class="sensor-node node-red">L_Red</button>
      </div>
    </div>

    <!-- Правая Стопа -->
    <div class="foot-map">
      <div class="foot-label">Правая (Right)</div>
      <div class="toes-row">
        <!-- У правой ноги большой палец (Желтый) слева, мизинец (Синий) справа -->
        <button id="btn-r-yellow" class="sensor-node node-yellow">R_Yel</button>
        <button id="btn-r-blue" class="sensor-node node-blue">R_Blu</button>
      </div>
      <div class="heel-row">
        <button id="btn-r-red" class="sensor-node node-red">R_Red</button>
      </div>
    </div>

  </div>

  <!-- БЛОК ГРАФИКОВ -->
  <div class="charts-wrapper">
    <div class="chart-box">
      <div class="chart-header">
        <span>Давление Левая</span>
        <div><span class="val-red" id="val-l-red">0</span> | <span class="val-yellow" id="val-l-yellow">0</span> | <span class="val-blue" id="val-l-blue">0</span></div>
      </div>
      <canvas id="chart-left"></canvas>
    </div>

    <div class="chart-box" style="border-bottom: none;">
      <div class="chart-header">
        <span>Давление Правая</span>
        <div><span class="val-red" id="val-r-red">0</span> | <span class="val-yellow" id="val-r-yellow">0</span> | <span class="val-blue" id="val-r-blue">0</span></div>
      </div>
      <canvas id="chart-right"></canvas>
    </div>
  </div>

  <script>
    // --- Настройка графиков ---
    function createChart(canvasId) {
      const canvas = document.getElementById(canvasId);
      const chart = new SmoothieChart({
        millisPerPixel: 15, 
        grid: { fillStyle: '#1a1a1a', strokeStyle: '#333', lineWidth: 1, borderVisible: false },
        labels: { fillStyle: '#ffffff', fontSize: 10 },
        maxValueScale: 1.2, minValue: 0
      });
      
      const lineRed = new TimeSeries();
      const lineYellow = new TimeSeries();
      const lineBlue = new TimeSeries();
      
      chart.addTimeSeries(lineRed, { strokeStyle: '#ff3b30', lineWidth: 3 });
      chart.addTimeSeries(lineYellow, { strokeStyle: '#ffcc00', lineWidth: 3 });
      chart.addTimeSeries(lineBlue, { strokeStyle: '#007aff', lineWidth: 3 });
      
      chart.streamTo(canvas, 0);
      return { lineRed, lineYellow, lineBlue, canvas };
    }

    const chartLeft = createChart('chart-left');
    const chartRight = createChart('chart-right');

    function resize() {
      chartLeft.canvas.width = chartLeft.canvas.parentElement.clientWidth;
      chartLeft.canvas.height = chartLeft.canvas.parentElement.clientHeight - 20;
      chartRight.canvas.width = chartRight.canvas.parentElement.clientWidth;
      chartRight.canvas.height = chartRight.canvas.parentElement.clientHeight - 20;
    }
    window.addEventListener('resize', resize);
    setTimeout(resize, 100);

    // --- Bluetooth Логика ---
    const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
    const buffers = {}; 

    function setupSensor(btnId, targetName, timeSeries, labelId) {
      document.getElementById(btnId).addEventListener('click', async () => {
        try {
          const device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: targetName }],
            optionalServices: [UART_SERVICE]
          });
          const server = await device.gatt.connect();
          const service = await server.getPrimaryService(UART_SERVICE);
          const characteristic = await service.getCharacteristic(UART_TX);
          await characteristic.startNotifications();
          
          characteristic.addEventListener('characteristicvaluechanged', (event) => {
            const id = device.id;
            if (!buffers[id]) buffers[id] = "";
            buffers[id] += new TextDecoder().decode(event.target.value);
            const lines = buffers[id].split('\n');
            if (lines.length > 1) {
              for (let i = 0; i < lines.length - 1; i++) {
                const parts = lines[i].trim().split(',');
                if (parts.length === 3) {
                  const fsr = parseInt(parts[0]);
                  timeSeries.append(new Date().getTime(), fsr);
                  document.getElementById(labelId).innerText = fsr;
                }
              }
              buffers[id] = lines[lines.length - 1];
            }
          });
          
          // Визуальное подтверждение подключения
          const btn = document.getElementById(btnId);
          btn.innerText = "OK";
          btn.classList.add("connected");
        } catch (error) { console.log(error); }
      });
    }

    // Левая нога
    setupSensor('btn-l-red', 'L_Red', chartLeft.lineRed, 'val-l-red');
    setupSensor('btn-l-yellow', 'L_Yel', chartLeft.lineYellow, 'val-l-yellow');
    setupSensor('btn-l-blue', 'L_Blu', chartLeft.lineBlue, 'val-l-blue');

    // Правая нога
    setupSensor('btn-r-red', 'R_Red', chartRight.lineRed, 'val-r-red');
    setupSensor('btn-r-yellow', 'R_Yel', chartRight.lineYellow, 'val-r-yellow');
    setupSensor('btn-r-blue', 'R_Blu', chartRight.lineBlue, 'val-r-blue');
  </script>
</body>
</html>
