<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Подометрия - Диагностика</title>
  <!-- Библиотека для графиков -->
  <script src="https://cdn.jsdelivr.net/npm/smoothie@1.36.1/smoothie.js"></script>
  <style>
    body { background-color: #121212; color: #fff; font-family: -apple-system, sans-serif; padding: 10px; margin: 0; }
    
    /* Панель глобального баланса */
    .balance-banner { 
      background: #1c1c1e; border: 2px solid #333; border-radius: 12px; padding: 15px; 
      text-align: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .balance-title { font-size: 14px; color: #888; margin-bottom: 5px; font-weight: bold; }
    .balance-values { font-size: 24px; font-weight: bold; }

    /* Блоки кнопок датчиков */
    .panels-container { display: flex; gap: 10px; margin-bottom: 20px; }
    .sensor-panel { 
      background: #1c1c1e; border-radius: 12px; padding: 15px; flex: 1; 
      display: flex; flex-direction: column; align-items: center; 
    }
    .sensor-panel h3 { margin: 0 0 10px 0; font-size: 14px; color: #aaa; text-transform: uppercase; }
    
    /* Локальный баланс стопы */
    .foot-balance { font-size: 11px; color: #888; text-align: center; margin-bottom: 15px; width: 100%; font-weight: bold; }
    .foot-balance span { font-size: 13px; }

    .buttons-grid { 
      display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; justify-items: center; 
    }
    
    /* Круглые кнопки - цвета больше не пропадают! */
    .btn-circle { 
      width: 55px; height: 55px; border-radius: 50%; border: 3px solid transparent; 
      color: white; font-weight: bold; font-size: 12px; cursor: pointer; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s;
    }
    .btn-circle:active { transform: scale(0.9); }
    .bg-blue { background-color: #0a84ff; }
    .bg-yellow { background-color: #ffcc00; color: #000; }
    .bg-red { background-color: #ff3b30; }
    
    /* Эффект подключения: свечение вокруг кнопки */
    .connected { border-color: #34c759 !important; box-shadow: 0 0 15px rgba(52,199,89,0.6); }
    
    /* Графики */
    .chart-container { margin-bottom: 15px; }
    .chart-header { 
      display: flex; justify-content: space-between; align-items: center; 
      font-size: 12px; color: #888; margin-bottom: 5px; padding: 0 5px;
    }
    .chart-values span { font-weight: bold; font-size: 14px; }
    canvas { width: 100%; height: 150px; background: #1c1c1e; border-radius: 8px; border: 1px solid #333; }
  </style>
</head>
<body>

  <!-- Главный экран баланса -->
  <div class="balance-banner">
    <div class="balance-title">ОБЩИЙ БАЛАНС ВЕСА</div>
    <div class="balance-values">
      ЛЕВ: <span id="left-pct">0%</span> &nbsp;|&nbsp; ПРАВ: <span id="right-pct">0%</span>
    </div>
  </div>

  <!-- Панели подключения датчиков -->
  <div class="panels-container">
    
    <!-- ЛЕВАЯ СТОПА -->
    <div class="sensor-panel">
      <h3>Левая (Left)</h3>
      <div class="foot-balance">
        ПЯТКА: <span id="l-heel" style="color:#ff3b30">0%</span><br>
        ВНУТР: <span id="l-in" style="color:#ffcc00">0%</span> | 
        ВНЕШ: <span id="l-out" style="color:#0a84ff">0%</span>
      </div>
      <div class="buttons-grid">
        <button id="btn-L_Blu" class="btn-circle bg-blue">L_Blu</button>
        <button id="btn-L_Yel" class="btn-circle bg-yellow">L_Yel</button>
        <button id="btn-L_Red" class="btn-circle bg-red" style="grid-column: span 2;">L_Red</button>
      </div>
    </div>
    
    <!-- ПРАВАЯ СТОПА -->
    <div class="sensor-panel">
      <h3>Правая (Right)</h3>
      <div class="foot-balance">
        ПЯТКА: <span id="r-heel" style="color:#ff3b30">0%</span><br>
        ВНУТР: <span id="r-in" style="color:#ffcc00">0%</span> | 
        ВНЕШ: <span id="r-out" style="color:#0a84ff">0%</span>
      </div>
      <div class="buttons-grid">
        <button id="btn-R_Yel" class="btn-circle bg-yellow">R_Yel</button>
        <button id="btn-R_Blu" class="btn-circle bg-blue">R_Blu</button>
        <button id="btn-R_Red" class="btn-circle bg-red" style="grid-column: span 2;">R_Red</button>
      </div>
    </div>
  </div>

  <!-- График Левой ноги -->
  <div class="chart-container">
    <div class="chart-header">
      <span>ЛЕВАЯ (ОТКАЛИБРОВАННО)</span>
      <div class="chart-values">
        <span id="val-L_Red" style="color:#ff3b30">0</span> | 
        <span id="val-L_Yel" style="color:#ffcc00">0</span> | 
        <span id="val-L_Blu" style="color:#0a84ff">0</span>
      </div>
    </div>
    <canvas id="chart-left"></canvas>
  </div>

  <!-- График Правой ноги -->
  <div class="chart-container">
    <div class="chart-header">
      <span>ПРАВАЯ (ОТКАЛИБРОВАННО)</span>
      <div class="chart-values">
        <span id="val-R_Red" style="color:#ff3b30">0</span> | 
        <span id="val-R_Yel" style="color:#ffcc00">0</span> | 
        <span id="val-R_Blu" style="color:#0a84ff">0</span>
      </div>
    </div>
    <canvas id="chart-right"></canvas>
  </div>

  <script>
    // ==========================================
    // 1. ЭТАЛОННЫЕ КОЭФФИЦИЕНТЫ
    // ==========================================
    const CALIBRATION = {
      'L_Red': 1.408, 'L_Yel': 6.667, 'L_Blu': 0.840,
      'R_Red': 3.125, 'R_Yel': 0.556, 'R_Blu': 1.786
    };

    const calValues = {
      'L_Red': 0, 'L_Yel': 0, 'L_Blu': 0,
      'R_Red': 0, 'R_Yel': 0, 'R_Blu': 0
    };

    // ==========================================
    // 2. НАСТРОЙКА ГРАФИКОВ
    // ==========================================
    const chartOptions = {
      millisPerPixel: 20, responsive: true,
      grid: { fillStyle: '#1c1c1e', strokeStyle: '#333', verticalSections: 4 },
      labels: { fillStyle: '#888', precision: 0 }, minValue: 0
    };
    
    const chartLeft = new SmoothieChart(chartOptions);
    const chartRight = new SmoothieChart(chartOptions);
    chartLeft.streamTo(document.getElementById('chart-left'), 100);
    chartRight.streamTo(document.getElementById('chart-right'), 100);

    const lines = {
      'L_Red': new TimeSeries(), 'L_Yel': new TimeSeries(), 'L_Blu': new TimeSeries(),
      'R_Red': new TimeSeries(), 'R_Yel': new TimeSeries(), 'R_Blu': new TimeSeries()
    };
    
    const colors = { Red: '#ff3b30', Yel: '#ffcc00', Blu: '#0a84ff' };

    chartLeft.addTimeSeries(lines['L_Red'], { strokeStyle: colors.Red, lineWidth: 2 });
    chartLeft.addTimeSeries(lines['L_Yel'], { strokeStyle: colors.Yel, lineWidth: 2 });
    chartLeft.addTimeSeries(lines['L_Blu'], { strokeStyle: colors.Blu, lineWidth: 2 });
    
    chartRight.addTimeSeries(lines['R_Red'], { strokeStyle: colors.Red, lineWidth: 2 });
    chartRight.addTimeSeries(lines['R_Yel'], { strokeStyle: colors.Yel, lineWidth: 2 });
    chartRight.addTimeSeries(lines['R_Blu'], { strokeStyle: colors.Blu, lineWidth: 2 });

    // ==========================================
    // 3. BLUETOOTH И ОБРАБОТКА ДАННЫХ
    // ==========================================
    const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
    const buffers = {};
    const sensorsList = Object.keys(CALIBRATION);

    function updateBalance() {
      // Суммы по ногам
      let leftTotal = calValues['L_Red'] + calValues['L_Yel'] + calValues['L_Blu'];
      let rightTotal = calValues['R_Red'] + calValues['R_Yel'] + calValues['R_Blu'];
      let totalWeight = leftTotal + rightTotal;

      // ОБЩИЙ БАЛАНС (Лево / Право)
      if (totalWeight > 20) { 
        document.getElementById('left-pct').innerText = Math.round((leftTotal / totalWeight) * 100) + '%';
        document.getElementById('right-pct').innerText = Math.round((rightTotal / totalWeight) * 100) + '%';
      } else {
        document.getElementById('left-pct').innerText = '0%';
        document.getElementById('right-pct').innerText = '0%';
      }

      // ЛОКАЛЬНЫЙ БАЛАНС (Левая нога)
      if (leftTotal > 10) {
        document.getElementById('l-heel').innerText = Math.round((calValues['L_Red'] / leftTotal) * 100) + '%';
        document.getElementById('l-in').innerText = Math.round((calValues['L_Yel'] / leftTotal) * 100) + '%';
        document.getElementById('l-out').innerText = Math.round((calValues['L_Blu'] / leftTotal) * 100) + '%';
      } else {
        document.getElementById('l-heel').innerText = '0%';
        document.getElementById('l-in').innerText = '0%';
        document.getElementById('l-out').innerText = '0%';
      }

      // ЛОКАЛЬНЫЙ БАЛАНС (Правая нога)
      if (rightTotal > 10) {
        document.getElementById('r-heel').innerText = Math.round((calValues['R_Red'] / rightTotal) * 100) + '%';
        document.getElementById('r-in').innerText = Math.round((calValues['R_Yel'] / rightTotal) * 100) + '%';
        document.getElementById('r-out').innerText = Math.round((calValues['R_Blu'] / rightTotal) * 100) + '%';
      } else {
        document.getElementById('r-heel').innerText = '0%';
        document.getElementById('r-in').innerText = '0%';
        document.getElementById('r-out').innerText = '0%';
      }
    }

    sensorsList.forEach(sensor => {
      document.getElementById(`btn-${sensor}`).addEventListener('click', async (e) => {
        try {
          const device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: sensor }],
            optionalServices: [UART_SERVICE]
          });
          const server = await device.gatt.connect();
          const service = await server.getPrimaryService(UART_SERVICE);
          const characteristic = await service.getCharacteristic(UART_TX);
          await characteristic.startNotifications();
          
          // Визуальное подключение (оставляем цвет, добавляем зеленое свечение)
          e.target.innerText = "OK";
          e.target.classList.add("connected");

          characteristic.addEventListener('characteristicvaluechanged', (event) => {
            const id = device.id;
            if (!buffers[id]) buffers[id] = "";
            buffers[id] += new TextDecoder().decode(event.target.value);
            const dataLines = buffers[id].split('\n');
            
            if (dataLines.length > 1) {
              for (let i = 0; i < dataLines.length - 1; i++) {
                const parts = dataLines[i].trim().split(',');
                if (parts.length === 3) {
                  const rawFsr = parseInt(parts[0]);
                  // Умножаем на ваш калибровочный множитель
                  const cleanValue = Math.round(rawFsr * CALIBRATION[sensor]);
                  calValues[sensor] = cleanValue;
                  
                  document.getElementById(`val-${sensor}`).innerText = cleanValue;
                  lines[sensor].append(new Date().getTime(), cleanValue);
                }
              }
              buffers[id] = dataLines[dataLines.length - 1];
              updateBalance(); 
            }
          });
        } catch (error) { console.log(error); }
      });
    });
  </script>
</body>
</html>
