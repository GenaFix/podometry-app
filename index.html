<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Holyiot Podometry</title>
  <!-- Библиотека для 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Библиотека для живых графиков IoT -->
  <script src="https://cdn.jsdelivr.net/npm/smoothie@1.36.1/smoothie.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #121212; color: white; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #ui-top { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; border-bottom: 1px solid #333; z-index: 10; }
    button { padding: 12px 20px; font-size: 16px; font-weight: bold; background: #0a84ff; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #value-display { font-size: 18px; font-weight: 600; color: #ff3b30; }
    #scene-container { flex: 1; position: relative; }
    #chart-container { height: 35%; background: #1a1a1a; border-top: 2px solid #333; padding: 10px; display: flex; flex-direction: column; }
    .chart-title { font-size: 14px; color: #aaa; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    canvas { display: block; }
  </style>
</head>
<body>

  <!-- Верхняя панель управления -->
  <div id="ui-top">
    <button id="connect">Подключить датчик</button>
    <div id="value-display">FSR: 0</div>
  </div>

  <!-- Окно для 3D модели (Наклон стопы) -->
  <div id="scene-container"></div>

  <!-- Окно для графика давления (Зоны опоры) -->
  <div id="chart-container">
    <div class="chart-title">График давления (Правая стопа)</div>
    <canvas id="pressure-chart"></canvas>
  </div>

  <script>
    // --- НАСТРОЙКА ЖИВОГО ГРАФИКА ---
    const canvas = document.getElementById('pressure-chart');
    canvas.width = window.innerWidth - 20; // Адаптация под экран iPhone
    canvas.height = document.getElementById('chart-container').clientHeight - 30;

    const chart = new SmoothieChart({
      millisPerPixel: 15, // Скорость прокрутки графика
      grid: { fillStyle: '#1a1a1a', strokeStyle: '#333', lineWidth: 1, borderVisible: false },
      labels: { fillStyle: '#ffffff', fontSize: 12 },
      maxValueScale: 1.2, // Автоматическое масштабирование по высоте
      minValue: 0
    });
    
    // Создаем линию для текущего датчика (в будущем их будет 3)
    const fsrLine = new TimeSeries();
    chart.addTimeSeries(fsrLine, { strokeStyle: '#ff3b30', lineWidth: 3, fillStyle: 'rgba(255, 59, 48, 0.2)' });
    chart.streamTo(canvas, 0);

    // --- НАСТРОЙКА 3D СЦЕНЫ ---
    const container = document.getElementById('scene-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Временная модель стопы (блок)
    const geometry = new THREE.BoxGeometry(2, 0.5, 4);
    const material = new THREE.MeshLambertMaterial({ color: 0x34c759 });
    const footModel = new THREE.Mesh(geometry, material);
    scene.add(footModel);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x606060));

    camera.position.set(0, 5, 7);
    camera.lookAt(0, 0, 0);

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // Обработка изменения размера экрана
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
      canvas.width = window.innerWidth - 20;
    });

    // --- BLUETOOTH ЛОГИКА ---
    const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const UART_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
    let buffer = "";

    document.getElementById('connect').addEventListener('click', async () => {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'Holyiot' }],
          optionalServices: [UART_SERVICE]
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(UART_SERVICE);
        const characteristic = await service.getCharacteristic(UART_TX);
        
        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', handleData);
        
        const btn = document.getElementById('connect');
        btn.innerText = "Подключено";
        btn.style.background = "#34c759";
      } catch (error) {
        alert("Ошибка: " + error);
      }
    });

    function handleData(event) {
      buffer += new TextDecoder().decode(event.target.value);
      const lines = buffer.split('\n');
      if (lines.length > 1) {
        for (let i = 0; i < lines.length - 1; i++) {
          processLine(lines[i].trim());
        }
        buffer = lines[lines.length - 1];
      }
    }

    function processLine(line) {
      if(!line) return;
      const parts = line.split(',');
      if (parts.length === 3) {
        const fsr = parseInt(parts[0]);
        const pitch = parseInt(parts[1]);
        const roll = parseInt(parts[2]);
        
        // 1. Добавляем точку на график давления
        fsrLine.append(new Date().getTime(), fsr);
        document.getElementById('value-display').innerText = `FSR: ${fsr}`;

        // 2. Вращаем 3D-модель (перевод из градусов в радианы)
        footModel.rotation.x = pitch * (Math.PI / 180);
        footModel.rotation.z = roll * (Math.PI / 180);

        // Изменение цвета 3D модели при давлении
        if (fsr > 50) {
            footModel.material.color.setHex(0xff3b30);
        } else {
            footModel.material.color.setHex(0x34c759);
        }
      }
    }
  </script>
</body>
</html>
