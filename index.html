<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Подометрия PRO - Точная Калибровка и Кинематика</title>
  
  <script src="https://cdn.jsdelivr.net/npm/smoothie@1.36.1/smoothie.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <style>
    body { background-color: #121212; color: #fff; font-family: -apple-system, sans-serif; padding: 10px; margin: 0; overflow-x: hidden; }
    
    .recorder-panel { background: #1c1c1e; border: 2px solid #ffcc00; border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    .recorder-controls { display: flex; justify-content: space-between; gap: 10px; }
    .btn-rec { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
    #btn-record { background: #ff3b30; } #btn-stop { background: #333; color: #888; } #btn-play { background: #34c759; }
    .timeline { width: 100%; margin: 0; }
    .status-badge { text-align: center; font-size: 11px; font-weight: bold; font-family: monospace; color: #ffcc00; }

    .balance-banner { background: #1c1c1e; border: 1px solid #333; border-radius: 12px; padding: 8px; text-align: center; margin-bottom: 10px; }
    .balance-title { font-size: 10px; color: #888; margin-bottom: 3px; font-weight: bold; text-transform: uppercase; }
    .balance-values { font-size: 18px; font-weight: bold; }
    #left-pct, #right-pct { display: inline-block; width: 55px; font-family: monospace; text-align: left; }
    
    /* РАБОЧАЯ ЗОНА */
    .workspace { position: relative; width: 100%; height: 260px; background: #000; border-radius: 12px; border: 1px solid #333; margin-bottom: 10px; overflow: hidden; }
    #canvas-3d { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    
    /* ЦЕНТРАЛЬНАЯ ПАНЕЛЬ */
    .center-controls {
      position: absolute; top: 52%; left: 50%; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 25px;
      z-index: 25; pointer-events: none;
    }
    
    .vertical-slider {
      writing-mode: vertical-lr; direction: rtl;
      width: 6px; height: 110px; accent-color: #0a84ff;
      background: rgba(255,255,255,0.1); border-radius: 3px;
      pointer-events: auto; cursor: pointer; opacity: 0.7; transition: opacity 0.2s;
    }
    .vertical-slider:active, .vertical-slider:hover { opacity: 1; }

    .btn-tare {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(28,28,30,0.8); border: 2px solid #0a84ff; color: #fff;
      font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center;
      pointer-events: auto; backdrop-filter: blur(4px); box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      transition: transform 0.1s, background 0.2s;
    }
    .btn-tare:active { background: #0a84ff; transform: scale(0.9); }

    /* Кнопки датчиков */
    .sensor-btn { 
      position: absolute; width: 38px; height: 38px; border-radius: 50%; 
      border: 2px solid rgba(255,255,255,0.4); color: white; 
      cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.8); z-index: 20;
      transform: translate(-50%, -50%); 
      font-family: monospace; line-height: 1.0;
      pointer-events: auto;
    }
    
    .sensor-btn .val { font-size: 10px; font-weight: bold; }
    .sensor-btn .pct { font-size: 7px; opacity: 0.9; }
    .sensor-btn.disconnected { font-size: 9px; font-weight: bold; }

    #btn-L_Red, #btn-R_Red { background: #ff3b30; }
    #btn-L_Yel, #btn-R_Yel { background: #ffcc00; color: #000; }
    #btn-L_Blu, #btn-R_Blu { background: #0a84ff; }
    
    .sensor-btn:active { transform: translate(-50%, -50%) scale(0.9); }
    .connected { border-color: #34c759 !important; box-shadow: 0 0 12px rgba(52,199,89,0.9); }

    .chart-container { margin-bottom: 8px; }
    .chart-header { display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-bottom: 3px; padding: 0 5px; }
    .chart-values span { font-weight: bold; font-size: 13px; font-family: monospace; display: inline-block; width: 30px; text-align: right; }
    canvas.chart-canvas { width: 100%; height: 80px; background: #1c1c1e; border-radius: 8px; border: 1px solid #333; }
  </style>
</head>
<body>

  <div class="recorder-panel">
    <div class="status-badge" id="rec-status">РЕЖИМ: LIVE (РЕАЛЬНОЕ ВРЕМЯ)</div>
    <div class="recorder-controls">
      <button id="btn-record" class="btn-rec">⏺ ЗАПИСЬ</button>
      <button id="btn-stop" class="btn-rec">⏹ СТОП</button>
      <button id="btn-play" class="btn-rec">▶ ПЛЕЕР</button>
    </div>
    <input type="range" id="timeline" class="timeline" min="0" max="0" value="0" disabled>
  </div>

  <div class="balance-banner">
    <div class="balance-title">Глобальное распределение</div>
    <div class="balance-values">ЛЕВ: <span id="left-pct">0%</span> | ПРАВ: <span id="right-pct">0%</span></div>
  </div>

  <div class="workspace" id="workspace-container">
    <div id="canvas-3d"></div>
    
    <div class="center-controls">
      <input type="range" id="camera-angle-slider" class="vertical-slider" min="1.5" max="6.5" step="0.2" value="3.5">
      <button id="btn-tare" class="btn-tare" title="Центровка 3D">🎯</button>
    </div>

    <div id="btn-L_Red" class="sensor-btn disconnected">L_Red</div>
    <div id="btn-L_Yel" class="sensor-btn disconnected">L_Yel</div>
    <div id="btn-L_Blu" class="sensor-btn disconnected">L_Blu</div>
    <div id="btn-R_Red" class="sensor-btn disconnected">R_Red</div>
    <div id="btn-R_Yel" class="sensor-btn disconnected">R_Yel</div>
    <div id="btn-R_Blu" class="sensor-btn disconnected">R_Blu</div>
  </div>

  <div class="chart-container">
    <div class="chart-header"><span>ЛЕВАЯ (ДИНАМИКА)</span><div class="chart-values"><span id="val-L_Red" style="color:#ff3b30">0</span> <span id="val-L_Yel" style="color:#ffcc00">0</span> <span id="val-L_Blu" style="color:#0a84ff">0</span></div></div>
    <canvas id="chart-left" class="chart-canvas"></canvas>
  </div>
  <div class="chart-container">
    <div class="chart-header"><span>ПРАВАЯ (ДИНАМИКА)</span><div class="chart-values"><span id="val-R_Red" style="color:#ff3b30">0</span> <span id="val-R_Yel" style="color:#ffcc00">0</span> <span id="val-R_Blu" style="color:#0a84ff">0</span></div></div>
    <canvas id="chart-right" class="chart-canvas"></canvas>
  </div>

  <script>
    // ==========================================
    // ИСПРАВЛЕНИЕ НАПРАВЛЕНИЯ (Реверс левой пятки)
    // ==========================================
    const SENSOR_DIR = {
        'L_Pitch': -1, // Умножаем на -1, чтобы левая нога поднималась вверх, а не опускалась вниз
        'L_Roll': 1,
        'R_Pitch': 1,  
        'R_Roll': 1
    };

    // ==========================================
    // ИДЕАЛЬНАЯ КАЛИБРОВКА ПО ЭТАЛОНУ 5 КГ
    // ==========================================
    const CALIBRATION = { 
        'L_Red': 1.389, 
        'L_Yel': 1.111, 
        'L_Blu': 0.917, 
        'R_Red': 2.326, 
        'R_Yel': 0.806, 
        'R_Blu': 2.439 
    };
    
    let currentState = { 
      calValues: { 'L_Red':0, 'L_Yel':0, 'L_Blu':0, 'R_Red':0, 'R_Yel':0, 'R_Blu':0 }, 
      sensorAngles: {
        'L_Red': { p:0, r:0, y:0 }, 'L_Yel': { p:0, r:0, y:0 }, 'L_Blu': { p:0, r:0, y:0 },
        'R_Red': { p:0, r:0, y:0 }, 'R_Yel': { p:0, r:0, y:0 }, 'R_Blu': { p:0, r:0, y:0 }
      },
      angles: { 'L_Pitch':0, 'L_Roll':0, 'L_Yaw':0, 'R_Pitch':0, 'R_Roll':0, 'R_Yaw':0 } 
    };
    
    let baselineAngles = { 'L_Pitch':0, 'L_Roll':0, 'L_Yaw':0, 'R_Pitch':0, 'R_Roll':0, 'R_Yaw':0 };
    let recordBuffer = []; let isRecording = false; let isPlaying = false;

    // Сброс положения (Центровка)
    document.getElementById('btn-tare').onclick = () => {
      baselineAngles = { ...currentState.angles };
      renderFrame(currentState);
    };

    // === THREE.JS СЦЕНА ===
    const container3d = document.getElementById('canvas-3d');
    const workspaceEl = document.getElementById('workspace-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, container3d.clientWidth / container3d.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container3d.clientWidth, container3d.clientHeight);
    container3d.appendChild(renderer.domElement);

    window.addEventListener('resize', () => {
      camera.aspect = container3d.clientWidth / container3d.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container3d.clientWidth, container3d.clientHeight);
    });

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); 
    dirLight.position.set(0, 10, 5); 
    scene.add(dirLight);

    const uiAnchors = [];

    const HINGE_Y = 3.6; 
    const SCALE = 1.2;

    function createAnatomicFootMesh(isLeft) {
      const footGroup = new THREE.Group();
      const sign = isLeft ? 1 : -1; 
      
      const material = new THREE.MeshPhongMaterial({ color: 0x555555, transparent: true, opacity: 0.9, shininess: 40 });
      const extrudeSettings = { depth: 0.1, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 3 };

      const heelShape = new THREE.Shape();
      heelShape.moveTo(0, -1.1); 
      heelShape.bezierCurveTo(sign * -0.45, -1.1, sign * -0.55, -0.2, sign * -0.55, 0.8);  
      heelShape.bezierCurveTo(sign * -0.55, 2.2, sign * -1.3, 3.4, sign * -1.35, 3.65); 
      heelShape.lineTo(sign * 1.0, 3.65); 
      heelShape.bezierCurveTo(sign * 1.0, 2.8, sign * 0.55, 2.2, sign * 0.55, 0.8);    
      heelShape.bezierCurveTo(sign * 0.55, -0.2, sign * 0.45, -1.1, 0, -1.1);             
      
      const heelMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(heelShape, extrudeSettings), material);

      const toeShape = new THREE.Shape();
      toeShape.moveTo(sign * -1.25, -0.05); 
      toeShape.bezierCurveTo(sign * -1.2, 0.4, sign * -1.2, 0.9, sign * -1.2, 0.9); 
      toeShape.bezierCurveTo(sign * -0.7, 1.8, sign * 0.7, 1.8, sign * 1.2, 0.9); 
      toeShape.bezierCurveTo(sign * 1.2, 0.5, sign * 1.05, 0.0, sign * 1.0, -0.05); 
      toeShape.lineTo(sign * -1.25, -0.05);
      
      const toeMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(toeShape, extrudeSettings), material);

      const toes = [
        { x: sign * 0.85, y: 1.4, r: 0.44 }, 
        { x: sign * 0.35, y: 1.7, r: 0.32 }, 
        { x: sign * -0.1, y: 1.6, r: 0.26 }, 
        { x: sign * -0.55,y: 1.3, r: 0.20 }, 
        { x: sign * -0.9, y: 0.8, r: 0.16 }  
      ];
      toes.forEach(toe => {
        const toeShapeC = new THREE.Shape();
        toeShapeC.absarc(toe.x, toe.y, toe.r, 0, Math.PI * 2, false);
        toeMesh.add(new THREE.Mesh(new THREE.ExtrudeGeometry(toeShapeC, extrudeSettings), material));
      });

      const heelGroup = new THREE.Group();
      heelGroup.add(heelMesh);

      const hingePivot = new THREE.Group();
      hingePivot.position.set(0, HINGE_Y, 0); 
      hingePivot.add(toeMesh);
      
      heelGroup.add(hingePivot);
      footGroup.add(heelGroup);
      footGroup.rotation.x = -Math.PI / 2; 

      function attachAnchor(id, x, y) {
        const anchor = new THREE.Object3D();
        anchor.position.set(x, y, 0.15); 
        anchor.userData = { btnId: 'btn-' + id };
        heelGroup.add(anchor);
        uiAnchors.push(anchor);
      }

      if (isLeft) {
        attachAnchor('L_Red', 0.0, -0.8);  
        attachAnchor('L_Yel', 0.8, 3.2);   
        attachAnchor('L_Blu', -0.8, 3.0);  
      } else {
        attachAnchor('R_Red', 0.0, -0.8);  
        attachAnchor('R_Yel', -0.8, 3.2);  
        attachAnchor('R_Blu', 0.8, 3.0);   
      }

      const wrapper = new THREE.Group();
      wrapper.scale.set(SCALE, SCALE, SCALE); 
      wrapper.add(footGroup);
      
      wrapper.userData = { hingePivot: hingePivot };
      return wrapper;
    }

    const meshLeftFoot = createAnatomicFootMesh(true);
    const meshRightFoot = createAnatomicFootMesh(false);
    
    const baseOutwardAngle = Math.PI * 0.08;
    meshLeftFoot.position.set(-1.7, -0.5, 0.2); 
    meshRightFoot.position.set(1.7, -0.5, 0.2); 

    scene.add(meshLeftFoot); scene.add(meshRightFoot);

    const gridHelper = new THREE.GridHelper(10, 10, 0x333333, 0x111111);
    gridHelper.position.y = -0.2;
    scene.add(gridHelper);

    const angleSlider = document.getElementById('camera-angle-slider');

    function updateCameraPosition() {
      const height = parseFloat(angleSlider.value);
      camera.position.set(0, height, 5.5 - (height * 0.2));
      camera.lookAt(0, -0.5, 0);
    }

    angleSlider.oninput = updateCameraPosition;
    updateCameraPosition();

    function updateUIElements() {
      const halfWidth = workspaceEl.clientWidth / 2;
      const halfHeight = workspaceEl.clientHeight / 2;

      uiAnchors.forEach(anchor => {
        const vector = new THREE.Vector3();
        anchor.getWorldPosition(vector);
        vector.project(camera);

        const x = (vector.x * halfWidth) + halfWidth;
        const y = -(vector.y * halfHeight) + halfHeight;

        const btn = document.getElementById(anchor.userData.btnId);
        if (btn) {
          btn.style.left = x + 'px';
          btn.style.top = y + 'px';
        }
      });
    }

    function animate3D() { 
      requestAnimationFrame(animate3D); 
      renderer.render(scene, camera); 
      updateUIElements();
    }
    animate3D();

    // === ГРАФИКИ ===
    const chartOpts = { millisPerPixel: 20, responsive: true, grid: { fillStyle: '#1c1c1e', strokeStyle: '#333' }, labels: { fillStyle: '#888', precision: 0 }, minValue: 0 };
    const chartLeft = new SmoothieChart(chartOpts); const chartRight = new SmoothieChart(chartOpts);
    chartLeft.streamTo(document.getElementById('chart-left'), 100); chartRight.streamTo(document.getElementById('chart-right'), 100);
    const lines = { 'L_Red': new TimeSeries(), 'L_Yel': new TimeSeries(), 'L_Blu': new TimeSeries(), 'R_Red': new TimeSeries(), 'R_Yel': new TimeSeries(), 'R_Blu': new TimeSeries() };
    const colors = { Red: '#ff3b30', Yel: '#ffcc00', Blu: '#0a84ff' };
    chartLeft.addTimeSeries(lines['L_Red'], { strokeStyle: colors.Red, lineWidth: 2 }); chartLeft.addTimeSeries(lines['L_Yel'], { strokeStyle: colors.Yel, lineWidth: 2 }); chartLeft.addTimeSeries(lines['L_Blu'], { strokeStyle: colors.Blu, lineWidth: 2 });
    chartRight.addTimeSeries(lines['R_Red'], { strokeStyle: colors.Red, lineWidth: 2 }); chartRight.addTimeSeries(lines['R_Yel'], { strokeStyle: colors.Yel, lineWidth: 2 }); chartRight.addTimeSeries(lines['R_Blu'], { strokeStyle: colors.Blu, lineWidth: 2 });

    function updateBtnDisplay(id, value, total) {
      const btn = document.getElementById('btn-' + id);
      if (btn && btn.classList.contains('connected')) {
        if (value > 0) {
            let pct = (total > 0) ? Math.round((value / total) * 100) : 0;
            btn.innerHTML = `<span class="val">${value}</span><span class="pct">${pct}%</span>`;
        } else {
            btn.innerHTML = `<span class="val">0</span>`;
        }
      }
    }

    // ИСПРАВЛЕННАЯ КИНЕМАТИКА (жесткая фиксация высоты)
    function applyKinematics(mesh, pitchDeg, rollDeg, yawDeg, frontPressure, isRight) {
      let pitchRad = THREE.MathUtils.degToRad(-pitchDeg); 
      let isHeelUp = pitchDeg > 3; 

      mesh.rotation.x = pitchRad;
      mesh.rotation.y = (isRight ? -baseOutwardAngle : baseOutwardAngle) + THREE.MathUtils.degToRad(yawDeg);
      mesh.rotation.z = THREE.MathUtils.degToRad(-rollDeg);

      // Жестко фиксируем позицию Y, чтобы модель никогда не улетала вверх
      mesh.position.y = -0.5;
      mesh.position.z = 0.2;

      // Выгибаем пальцы, если пятка в воздухе, а носок опирается на землю
      if (isHeelUp && frontPressure > 0) {
        mesh.userData.hingePivot.rotation.x = THREE.MathUtils.degToRad(pitchDeg); 
      } else {
        mesh.userData.hingePivot.rotation.x = 0;
      }
    }

    function renderFrame(state) {
      let lTot = state.calValues['L_Red'] + state.calValues['L_Yel'] + state.calValues['L_Blu'];
      let rTot = state.calValues['R_Red'] + state.calValues['R_Yel'] + state.calValues['R_Blu'];

      if ((lTot + rTot) > 20) { 
        document.getElementById('left-pct').innerText = Math.round((lTot / (lTot + rTot)) * 100) + '%';
        document.getElementById('right-pct').innerText = Math.round((rTot / (lTot + rTot)) * 100) + '%';
      } else { document.getElementById('left-pct').innerText = '0%'; document.getElementById('right-pct').innerText = '0%'; }

      updateBtnDisplay('L_Red', state.calValues['L_Red'], lTot);
      updateBtnDisplay('L_Yel', state.calValues['L_Yel'], lTot);
      updateBtnDisplay('L_Blu', state.calValues['L_Blu'], lTot);
      updateBtnDisplay('R_Red', state.calValues['R_Red'], rTot);
      updateBtnDisplay('R_Yel', state.calValues['R_Yel'], rTot);
      updateBtnDisplay('R_Blu', state.calValues['R_Blu'], rTot);

      Object.keys(CALIBRATION).forEach(s => {
        document.getElementById(`val-${s}`).innerText = state.calValues[s];
        if(!isPlaying) lines[s].append(new Date().getTime(), state.calValues[s]);
      });

      // Применяем математику сдвига (Центровка) + НАСТРОЙКИ ИНВЕРСИИ (SENSOR_DIR)
      let dL_Pitch = (state.angles['L_Pitch'] - baselineAngles['L_Pitch']) * SENSOR_DIR['L_Pitch'];
      let dL_Roll = (state.angles['L_Roll'] - baselineAngles['L_Roll']) * SENSOR_DIR['L_Roll'];
      let dL_Yaw = (state.angles['L_Yaw'] - baselineAngles['L_Yaw']); 
      let l_frontP = state.calValues['L_Yel'] + state.calValues['L_Blu'];

      let dR_Pitch = (state.angles['R_Pitch'] - baselineAngles['R_Pitch']) * SENSOR_DIR['R_Pitch'];
      let dR_Roll = (state.angles['R_Roll'] - baselineAngles['R_Roll']) * SENSOR_DIR['R_Roll'];
      let dR_Yaw = (state.angles['R_Yaw'] - baselineAngles['R_Yaw']);
      let r_frontP = state.calValues['R_Yel'] + state.calValues['R_Blu'];

      applyKinematics(meshLeftFoot, dL_Pitch, dL_Roll, dL_Yaw, l_frontP, false);
      applyKinematics(meshRightFoot, dR_Pitch, dR_Roll, dR_Yaw, r_frontP, true);
    }

    const btnRecord = document.getElementById('btn-record'); const btnStop = document.getElementById('btn-stop'); const btnPlay = document.getElementById('btn-play');
    const timeline = document.getElementById('timeline'); const statusBadge = document.getElementById('rec-status'); let playInterval;

    btnRecord.onclick = () => { isRecording = true; isPlaying = false; recordBuffer = []; clearInterval(playInterval); btnRecord.style.opacity = "0.5"; btnStop.style.opacity = "1"; btnPlay.style.opacity = "1"; statusBadge.innerText = "🔴 ИДЕТ ЗАПИСЬ..."; statusBadge.style.color = "#ff3b30"; timeline.disabled = true; };
    btnStop.onclick = () => { isRecording = false; isPlaying = false; clearInterval(playInterval); btnRecord.style.opacity = "1"; statusBadge.innerText = `ЗАПИСАНО КАДРОВ: ${recordBuffer.length}`; statusBadge.style.color = "#ffcc00"; if(recordBuffer.length > 0) { timeline.disabled = false; timeline.max = recordBuffer.length - 1; timeline.value = 0; } };
    btnPlay.onclick = () => { if(recordBuffer.length === 0) return; isRecording = false; isPlaying = true; btnRecord.style.opacity = "1"; statusBadge.innerText = "▶ ВОСПРОИЗВЕДЕНИЕ"; statusBadge.style.color = "#34c759"; timeline.disabled = false; clearInterval(playInterval); let i = parseInt(timeline.value); playInterval = setInterval(() => { if(i >= recordBuffer.length) { clearInterval(playInterval); statusBadge.innerText = "ПАУЗА"; return; } timeline.value = i; renderFrame(recordBuffer[i]); i++; }, 50); };
    timeline.oninput = () => { if(recordBuffer.length === 0) return; isPlaying = true; clearInterval(playInterval); statusBadge.innerText = "⏸ ПРОСМОТР КАДРА"; statusBadge.style.color = "#0a84ff"; renderFrame(recordBuffer[timeline.value]); };

    const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e"; const UART_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; const buffers = {};

    Object.keys(CALIBRATION).forEach(sensor => {
      document.getElementById(`btn-${sensor}`).addEventListener('click', async (e) => {
        try {
          const device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: sensor }], optionalServices: [UART_SERVICE] });
          const server = await device.gatt.connect(); const service = await server.getPrimaryService(UART_SERVICE); const characteristic = await service.getCharacteristic(UART_TX);
          await characteristic.startNotifications();
          e.target.innerText = "OK"; 
          e.target.classList.remove("disconnected");
          e.target.classList.add("connected");

          characteristic.addEventListener('characteristicvaluechanged', (event) => {
            if(isPlaying) return; 
            const id = device.id; if (!buffers[id]) buffers[id] = ""; buffers[id] += new TextDecoder().decode(event.target.value); const dataLines = buffers[id].split('\n');
            
            if (dataLines.length > 1) {
              for (let i = 0; i < dataLines.length - 1; i++) {
                const parts = dataLines[i].trim().split(',');
                if (parts.length >= 3) {
                  const rawFsr = parseInt(parts[0]); 
                  const pitch = parseInt(parts[1]); 
                  const roll = parseInt(parts[2]);
                  const yaw = parts.length >= 4 ? parseInt(parts[3]) : 0; 

                  if (isNaN(rawFsr) || isNaN(pitch) || isNaN(roll)) continue;

                  // Умножаем сырые показания давления на новые калибровочные коэффициенты
                  currentState.calValues[sensor] = Math.round(rawFsr * CALIBRATION[sensor]);
                  currentState.sensorAngles[sensor] = { p: pitch, r: roll, y: yaw };

                  if (sensor.startsWith('L_')) {
                    currentState.angles['L_Pitch'] = currentState.sensorAngles['L_Red'].p;
                    let rSum = 0, rCnt = 0;
                    if (document.getElementById('btn-L_Yel').classList.contains('connected')) { rSum += currentState.sensorAngles['L_Yel'].r; rCnt++; }
                    if (document.getElementById('btn-L_Blu').classList.contains('connected')) { rSum += currentState.sensorAngles['L_Blu'].r; rCnt++; }
                    currentState.angles['L_Roll'] = rCnt > 0 ? rSum / rCnt : currentState.sensorAngles['L_Red'].r;
                    currentState.angles['L_Yaw'] = currentState.sensorAngles['L_Red'].y;
                  }
                  if (sensor.startsWith('R_')) {
                    currentState.angles['R_Pitch'] = currentState.sensorAngles['R_Red'].p;
                    let rSum = 0, rCnt = 0;
                    if (document.getElementById('btn-R_Yel').classList.contains('connected')) { rSum += currentState.sensorAngles['R_Yel'].r; rCnt++; }
                    if (document.getElementById('btn-R_Blu').classList.contains('connected')) { rSum += currentState.sensorAngles['R_Blu'].r; rCnt++; }
                    currentState.angles['R_Roll'] = rCnt > 0 ? rSum / rCnt : currentState.sensorAngles['R_Red'].r;
                    currentState.angles['R_Yaw'] = currentState.sensorAngles['R_Red'].y;
                  }
                }
              }
              buffers[id] = dataLines[dataLines.length - 1];
              renderFrame(currentState);
              if (isRecording) recordBuffer.push(JSON.parse(JSON.stringify(currentState))); 
            }
          });
        } catch (error) { console.log(error); }
      });
    });
  </script>
</body>
</html>
