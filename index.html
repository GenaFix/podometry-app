<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Подометрия PRO - Финальная фиксация</title>
  
  <script src="https://cdn.jsdelivr.net/npm/smoothie@1.36.1/smoothie.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <style>
    body { background-color: #121212; color: #fff; font-family: -apple-system, sans-serif; padding: 10px; margin: 0; overflow-x: hidden; }
    
    .recorder-panel { background: #1c1c1e; border: 2px solid #ffcc00; border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    .recorder-controls { display: flex; justify-content: space-between; gap: 10px; }
    .btn-rec { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
    #btn-record { background: #ff3b30; } #btn-stop { background: #333; color: #888; } #btn-play { background: #34c759; }
    .timeline { width: 100%; margin: 0; }
    .status-badge { text-align: center; font-size: 11px; font-weight: bold; font-family: monospace; color: #ffcc00; }

    .balance-banner { background: #1c1c1e; border: 1px solid #333; border-radius: 12px; padding: 8px; text-align: center; margin-bottom: 10px; }
    .balance-title { font-size: 10px; color: #888; margin-bottom: 3px; font-weight: bold; text-transform: uppercase; }
    .balance-values { font-size: 18px; font-weight: bold; }
    #left-pct, #right-pct { display: inline-block; width: 55px; font-family: monospace; text-align: left; }
    
    /* РАБОЧАЯ ЗОНА */
    .workspace { position: relative; width: 100%; height: 260px; background: #000; border-radius: 12px; border: 1px solid #333; margin-bottom: 10px; overflow: hidden; }
    #canvas-3d { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    
    /* Стабильные CSS-координаты кнопок по центру экрана */
    .sensor-btn { 
      position: absolute; width: 42px; height: 42px; border-radius: 50%; 
      border: 2px solid rgba(255,255,255,0.3); color: white; 
      cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.8); z-index: 20;
      transform: translate(-50%, -50%); 
      font-family: monospace; line-height: 1.1;
    }
    
    .sensor-btn .val { font-size: 11px; font-weight: bold; }
    .sensor-btn .pct { font-size: 8px; opacity: 0.8; }
    .sensor-btn.disconnected { font-size: 9px; font-weight: bold; }

    /* Четко расставляем кнопки по анатомическим зонам стоп */
    #btn-L_Red { background: #ff3b30; bottom: 20%; left: 32%; }
    #btn-L_Yel { background: #ffcc00; color: #000; top: 35%; left: 38%; }
    #btn-L_Blu { background: #0a84ff; top: 35%; left: 22%; }

    #btn-R_Red { background: #ff3b30; bottom: 20%; right: 32%; left: auto; }
    #btn-R_Yel { background: #ffcc00; color: #000; top: 35%; right: 38%; left: auto; }
    #btn-R_Blu { background: #0a84ff; top: 35%; right: 22%; left: auto; }
    
    .sensor-btn:active { transform: translate(-50%, -50%) scale(0.9); }
    .connected { border-color: #34c759 !important; box-shadow: 0 0 15px rgba(52,199,89,0.9); }

    .chart-container { margin-bottom: 8px; }
    .chart-header { display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-bottom: 3px; padding: 0 5px; }
    .chart-values span { font-weight: bold; font-size: 13px; font-family: monospace; display: inline-block; width: 30px; text-align: right; }
    canvas.chart-canvas { width: 100%; height: 80px; background: #1c1c1e; border-radius: 8px; border: 1px solid #333; }
  </style>
</head>
<body>

  <div class="recorder-panel">
    <div class="status-badge" id="rec-status">РЕЖИМ: LIVE (РЕАЛЬНОЕ ВРЕМЯ)</div>
    <div class="recorder-controls">
      <button id="btn-record" class="btn-rec">⏺ ЗАПИСЬ</button>
      <button id="btn-stop" class="btn-rec">⏹ СТОП</button>
      <button id="btn-play" class="btn-rec">▶ ПЛЕЕР</button>
    </div>
    <input type="range" id="timeline" class="timeline" min="0" max="0" value="0" disabled>
  </div>

  <div class="balance-banner">
    <div class="balance-title">Глобальное распределение</div>
    <div class="balance-values">ЛЕВ: <span id="left-pct">0%</span> | ПРАВ: <span id="right-pct">0%</span></div>
  </div>

  <div class="workspace" id="workspace-container">
    <div id="canvas-3d"></div>
    
    <div id="btn-L_Red" class="sensor-btn disconnected">L_Red</div>
    <div id="btn-L_Yel" class="sensor-btn disconnected">L_Yel</div>
    <div id="btn-L_Blu" class="sensor-btn disconnected">L_Blu</div>
    <div id="btn-R_Red" class="sensor-btn disconnected">R_Red</div>
    <div id="btn-R_Yel" class="sensor-btn disconnected">R_Yel</div>
    <div id="btn-R_Blu" class="sensor-btn disconnected">R_Blu</div>
  </div>

  <div class="chart-container">
    <div class="chart-header"><span>ЛЕВАЯ (ДИНАМИКА)</span><div class="chart-values"><span id="val-L_Red" style="color:#ff3b30">0</span> <span id="val-L_Yel" style="color:#ffcc00">0</span> <span id="val-L_Blu" style="color:#0a84ff">0</span></div></div>
    <canvas id="chart-left" class="chart-canvas"></canvas>
  </div>
  <div class="chart-container">
    <div class="chart-header"><span>ПРАВАЯ (ДИНАМИКА)</span><div class="chart-values"><span id="val-R_Red" style="color:#ff3b30">0</span> <span id="val-R_Yel" style="color:#ffcc00">0</span> <span id="val-R_Blu" style="color:#0a84ff">0</span></div></div>
    <canvas id="chart-right" class="chart-canvas"></canvas>
  </div>

  <script>
    const CALIBRATION = { 'L_Red': 1.408, 'L_Yel': 6.667, 'L_Blu': 0.840, 'R_Red': 3.125, 'R_Yel': 0.556, 'R_Blu': 1.786 };
    let currentState = { calValues: { 'L_Red':0, 'L_Yel':0, 'L_Blu':0, 'R_Red':0, 'R_Yel':0, 'R_Blu':0 }, angles: { 'L_Pitch':0, 'L_Roll':0, 'R_Pitch':0, 'R_Roll':0 } };
    let recordBuffer = []; let isRecording = false; let isPlaying = false;

    // === THREE.JS СТАБИЛЬНАЯ СЦЕНА ===
    const container3d = document.getElementById('canvas-3d');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, container3d.clientWidth / container3d.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container3d.clientWidth, container3d.clientHeight);
    container3d.appendChild(renderer.domElement);

    window.addEventListener('resize', () => {
      camera.aspect = container3d.clientWidth / container3d.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container3d.clientWidth, container3d.clientHeight);
    });

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); 
    dirLight.position.set(0, 10, 5); 
    scene.add(dirLight);

    function createAnatomicFootMesh(isLeft) {
      const footGroup = new THREE.Group();
      const sign = isLeft ? 1 : -1; 
      
      const material = new THREE.MeshPhongMaterial({ color: 0x555555, transparent: true, opacity: 0.85, shininess: 40 });
      const extrudeSettings = { depth: 0.3, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 3 };

      const s = new THREE.Shape();
      s.moveTo(0, -1.0); 
      s.bezierCurveTo(sign * -0.6, -1.0, sign * -0.7, 0.0, sign * -0.7, 1.0); 
      s.bezierCurveTo(sign * -0.8, 2.2, sign * -0.9, 3.2, sign * -0.8, 4.0);  
      s.bezierCurveTo(sign * -0.4, 4.6, sign * 0.7, 4.6, sign * 0.9, 3.6);  
      s.bezierCurveTo(sign * 1.0, 2.6, sign * 0.5, 1.6, sign * 0.4, 0.6);    
      s.bezierCurveTo(sign * 0.4, -0.4, sign * 0.4, -1.0, 0, -1.0);             
      
      footGroup.add(new THREE.Mesh(new THREE.ExtrudeGeometry(s, extrudeSettings), material));

      const toes = [
        { x: sign * 0.6,  y: 4.6, r: 0.35 }, 
        { x: sign * 0.15, y: 4.8, r: 0.25 }, 
        { x: sign * -0.2, y: 4.6, r: 0.20 }, 
        { x: sign * -0.45,y: 4.2, r: 0.16 }, 
        { x: sign * -0.65,y: 3.7, r: 0.13 }  
      ];
      toes.forEach(toe => {
        const toeShape = new THREE.Shape();
        toeShape.absarc(toe.x, toe.y, toe.r, 0, Math.PI * 2, false);
        footGroup.add(new THREE.Mesh(new THREE.ExtrudeGeometry(toeShape, extrudeSettings), material));
      });

      const wrapper = new THREE.Group();
      footGroup.rotation.x = -Math.PI / 2; 
      footGroup.position.set(0, 0, 0);     
      wrapper.scale.set(0.9, 0.9, 0.9);
      wrapper.add(footGroup);
      return wrapper;
    }

    const meshLeftFoot = createAnatomicFootMesh(true);
    const meshRightFoot = createAnatomicFootMesh(false);
    
    // Позиционируем стопы строго по центру экрана
    meshLeftFoot.position.set(-1.1, 0, 0.2); 
    meshRightFoot.position.set(1.1, 0, 0.2);
    scene.add(meshLeftFoot); scene.add(meshRightFoot);

    const gridHelper = new THREE.GridHelper(10, 10, 0x333333, 0x111111);
    gridHelper.position.y = -0.2;
    scene.add(gridHelper);

    // Фиксированная камера с идеальным обзором всей стопы целиком
    camera.position.set(0, 6.0, 5.5); 
    camera.lookAt(0, 0, 0.2); 

    function animate3D() { 
      requestAnimationFrame(animate3D); 
      renderer.render(scene, camera); 
    }
    animate3D();

    // === ГРАФИКИ ===
    const chartOpts = { millisPerPixel: 20, responsive: true, grid: { fillStyle: '#1c1c1e', strokeStyle: '#333' }, labels: { fillStyle: '#888', precision: 0 }, minValue: 0 };
    const chartLeft = new SmoothieChart(chartOpts); const chartRight = new SmoothieChart(chartOpts);
    chartLeft.streamTo(document.getElementById('chart-left'), 100); chartRight.streamTo(document.getElementById('chart-right'), 100);
    const lines = { 'L_Red': new TimeSeries(), 'L_Yel': new TimeSeries(), 'L_Blu': new TimeSeries(), 'R_Red': new TimeSeries(), 'R_Yel': new TimeSeries(), 'R_Blu': new TimeSeries() };
    const colors = { Red: '#ff3b30', Yel: '#ffcc00', Blu: '#0a84ff' };
    chartLeft.addTimeSeries(lines['L_Red'], { strokeStyle: colors.Red, lineWidth: 2 }); chartLeft.addTimeSeries(lines['L_Yel'], { strokeStyle: colors.Yel, lineWidth: 2 }); chartLeft.addTimeSeries(lines['L_Blu'], { strokeStyle: colors.Blu, lineWidth: 2 });
    chartRight.addTimeSeries(lines['R_Red'], { strokeStyle: colors.Red, lineWidth: 2 }); chartRight.addTimeSeries(lines['R_Yel'], { strokeStyle: colors.Yel, lineWidth: 2 }); chartRight.addTimeSeries(lines['R_Blu'], { strokeStyle: colors.Blu, lineWidth: 2 });

    function updateBtnDisplay(id, value, total) {
      const btn = document.getElementById(id);
      if (btn && btn.classList.contains('connected')) {
        if (value > 0) {
            let pct = (total > 0) ? Math.round((value / total) * 100) : 0;
            btn.innerHTML = `<span class="val">${value}</span><span class="pct">${pct}%</span>`;
        } else {
            btn.innerHTML = `<span class="val">0</span>`;
        }
      }
    }

    function renderFrame(state) {
      let lTot = state.calValues['L_Red'] + state.calValues['L_Yel'] + state.calValues['L_Blu'];
      let rTot = state.calValues['R_Red'] + state.calValues['R_Yel'] + state.calValues['R_Blu'];
      let tTot = lTot + rTot;

      if (tTot > 20) { 
        document.getElementById('left-pct').innerText = Math.round((lTot / tTot) * 100) + '%';
        document.getElementById('right-pct').innerText = Math.round((rTot / tTot) * 100) + '%';
      } else { document.getElementById('left-pct').innerText = '0%'; document.getElementById('right-pct').innerText = '0%'; }

      updateBtnDisplay('btn-L_Red', state.calValues['L_Red'], lTot);
      updateBtnDisplay('btn-L_Yel', state.calValues['L_Yel'], lTot);
      updateBtnDisplay('btn-L_Blu', state.calValues['L_Blu'], lTot);
      updateBtnDisplay('btn-R_Red', state.calValues['R_Red'], rTot);
      updateBtnDisplay('btn-R_Yel', state.calValues['R_Yel'], rTot);
      updateBtnDisplay('btn-R_Blu', state.calValues['R_Blu'], rTot);

      Object.keys(CALIBRATION).forEach(s => {
        document.getElementById(`val-${s}`).innerText = state.calValues[s];
        if(!isPlaying) lines[s].append(new Date().getTime(), state.calValues[s]);
      });

      meshLeftFoot.rotation.x = THREE.MathUtils.degToRad(state.angles['L_Pitch']);
      meshLeftFoot.rotation.z = THREE.MathUtils.degToRad(-state.angles['L_Roll']);
      meshRightFoot.rotation.x = THREE.MathUtils.degToRad(state.angles['R_Pitch']);
      meshRightFoot.rotation.z = THREE.MathUtils.degToRad(state.angles['R_Roll']);
    }

    const btnRecord = document.getElementById('btn-record'); const btnStop = document.getElementById('btn-stop'); const btnPlay = document.getElementById('btn-play');
    const timeline = document.getElementById('timeline'); const statusBadge = document.getElementById('rec-status'); let playInterval;

    btnRecord.onclick = () => { isRecording = true; isPlaying = false; recordBuffer = []; clearInterval(playInterval); btnRecord.style.opacity = "0.5"; btnStop.style.opacity = "1"; btnPlay.style.opacity = "1"; statusBadge.innerText = "🔴 ИДЕТ ЗАПИСЬ..."; statusBadge.style.color = "#ff3b30"; timeline.disabled = true; };
    btnStop.onclick = () => { isRecording = false; isPlaying = false; clearInterval(playInterval); btnRecord.style.opacity = "1"; statusBadge.innerText = `ЗАПИСАНО КАДРОВ: ${recordBuffer.length}`; statusBadge.style.color = "#ffcc00"; if(recordBuffer.length > 0) { timeline.disabled = false; timeline.max = recordBuffer.length - 1; timeline.value = 0; } };
    btnPlay.onclick = () => { if(recordBuffer.length === 0) return; isRecording = false; isPlaying = true; btnRecord.style.opacity = "1"; statusBadge.innerText = "▶ ВОСПРОИЗВЕДЕНИЕ"; statusBadge.style.color = "#34c759"; timeline.disabled = false; clearInterval(playInterval); let i = parseInt(timeline.value); playInterval = setInterval(() => { if(i >= recordBuffer.length) { clearInterval(playInterval); statusBadge.innerText = "ПАУЗА"; return; } timeline.value = i; renderFrame(recordBuffer[i]); i++; }, 50); };
    timeline.oninput = () => { if(recordBuffer.length === 0) return; isPlaying = true; clearInterval(playInterval); statusBadge.innerText = "⏸ ПРОСМОТР КАДРА"; statusBadge.style.color = "#0a84ff"; renderFrame(recordBuffer[timeline.value]); };

    const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e"; const UART_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; const buffers = {};

    Object.keys(CALIBRATION).forEach(sensor => {
      document.getElementById(`btn-${sensor}`).addEventListener('click', async (e) => {
        try {
          const device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: sensor }], optionalServices: [UART_SERVICE] });
          const server = await device.gatt.connect(); const service = await server.getPrimaryService(UART_SERVICE); const characteristic = await service.getCharacteristic(UART_TX);
          await characteristic.startNotifications();
          e.target.innerText = "OK"; 
          e.target.classList.remove("disconnected");
          e.target.classList.add("connected");

          characteristic.addEventListener('characteristicvaluechanged', (event) => {
            if(isPlaying) return; 
            const id = device.id; if (!buffers[id]) buffers[id] = ""; buffers[id] += new TextDecoder().decode(event.target.value); const dataLines = buffers[id].split('\n');
            
            if (dataLines.length > 1) {
              for (let i = 0; i < dataLines.length - 1; i++) {
                const parts = dataLines[i].trim().split(',');
                if (parts.length === 3) {
                  const rawFsr = parseInt(parts[0]); const pitch = parseInt(parts[1]); const roll = parseInt(parts[2]);
                  if (isNaN(rawFsr) || isNaN(pitch) || isNaN(roll)) continue;

                  currentState.calValues[sensor] = Math.round(rawFsr * CALIBRATION[sensor]);
                  if (sensor === 'L_Red') { currentState.angles['L_Pitch'] = pitch; currentState.angles['L_Roll'] = roll; }
                  if (sensor === 'R_Red') { currentState.angles['R_Pitch'] = pitch; currentState.angles['R_Roll'] = roll; }
                }
              }
              buffers[id] = dataLines[dataLines.length - 1];
              renderFrame(currentState);
              if (isRecording) recordBuffer.push(JSON.parse(JSON.stringify(currentState))); 
            }
          });
        } catch (error) { console.log(error); }
      });
    });
  </script>
</body>
</html>
